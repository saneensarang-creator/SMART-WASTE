<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Map - SMART WASTE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .map-page { max-width:100%; margin:0; padding:0; }
    #map { width:100%; height:calc(100vh - 80px); }
    .map-controls { position:absolute; top:20px; right:20px; z-index:1000; background:#fff; padding:1rem; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.12); }
    .map-controls button { display:block; margin:0.5rem 0; }
    .info-box { position:absolute; bottom:20px; left:20px; z-index:1000; background:#fff; padding:1rem; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.12); max-width:250px; }
    .info-box h4 { margin:0 0 0.5rem 0; }
    .info-box p { margin:0.25rem 0; font-size:0.9rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <!-- logo removed for maps page -->
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#services" class="nav-link">Services</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="map-page">
    <div id="map"></div>
    
    <div class="map-controls">
      <button id="btnLocate" class="btn">📍 My Location</button>
      <button id="btnKerala" class="btn">🗺️ Focus Kerala</button>
      <button id="btnReset" class="btn">🔄 Reset Map</button>
    </div>

    <div class="info-box">
      <h4>Waste Management Facilities</h4>
      <p id="facilityInfo">Select a location or use My Location to find nearby facilities.</p>
    </div>
  </main>

  <script>
    // Initialize map centered on Kerala, India
    const map = L.map('map').setView([10.8505, 76.2711], 7);
    
    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Kerala coordinates (approximate bounding box)
    const keralaLatLng = L.latLng(10.8505, 76.2711);
    let currentLocationMarker = null;
    let userMarker = null;

    // Sample waste facilities in Kerala
    const facilities = [
      { name: 'Kochi Waste Hub', lat: 9.9312, lng: 76.2673, type: 'Recycling Center' },
      { name: 'Thiruvananthapuram Composting', lat: 8.5241, lng: 76.9366, type: 'Composting Center' },
      { name: 'Kozhikode Disposal Center', lat: 11.2588, lng: 75.7804, type: 'Waste Management' },
      { name: 'Ernakulam Recycling Hub', lat: 9.9674, lng: 76.3022, type: 'Recycling Center' },
      { name: 'Kannur Waste Collection', lat: 12.2381, lng: 75.3711, type: 'Collection Point' }
    ];

    // Add facility markers
    const facilityGroup = L.featureGroup();
    facilities.forEach(f => {
      const marker = L.circleMarker([f.lat, f.lng], {
        radius: 8,
        fillColor: '#27ae60',
        color: '#fff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.8
      }).bindPopup(`<strong>${f.name}</strong><br>${f.type}`)
       .addTo(map);
      
      marker.on('click', () => {
        document.getElementById('facilityInfo').innerHTML = `<strong>${f.name}</strong><br>${f.type}<br>Lat: ${f.lat.toFixed(4)}, Lng: ${f.lng.toFixed(4)}`;
      });
    });

    // Highlight Kerala region with a circle
    const keralaCircle = L.circle(keralaLatLng, {
      color: '#2ecc71',
      fillColor: '#27ae60',
      fillOpacity: 0.1,
      weight: 3,
      radius: 100000 // ~100km radius
    }).addTo(map);

    // Add Kerala label
    L.marker(keralaLatLng, {
      icon: L.divIcon({
        className: 'kerala-label',
        html: '<div style="background:#27ae60;color:#fff;padding:4px 8px;border-radius:4px;font-weight:bold;font-size:14px;">KERALA</div>',
        iconSize: null,
        iconAnchor: null
      })
    }).addTo(map);

    // Get current location
    function getCurrentLocation() {
      document.getElementById('facilityInfo').innerHTML = 'Locating...';
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          if (userMarker) map.removeLayer(userMarker);
          
          userMarker = L.marker([lat, lng], {
            icon: L.divIcon({
              className: 'user-marker',
              html: '<div style="background:#3498db;color:#fff;padding:6px 12px;border-radius:4px;font-weight:bold;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.2);">📍 You</div>',
              iconSize: null,
              iconAnchor: null
            })
          }).addTo(map);
          
          map.setView([lat, lng], 12);
          document.getElementById('facilityInfo').innerHTML = `Your location:<br>Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}<br><br>Nearest facilities are highlighted in green.`;
        }, (error) => {
          document.getElementById('facilityInfo').innerHTML = 'Could not access location: ' + error.message;
          // Default to Kerala
          map.setView(keralaLatLng, 7);
        });
      } else {
        document.getElementById('facilityInfo').innerHTML = 'Geolocation not supported';
      }
    }

    // Focus on Kerala
    function focusKerala() {
      map.setView(keralaLatLng, 7);
      document.getElementById('facilityInfo').innerHTML = 'Viewing Kerala waste management facilities. Green markers show service locations.';
    }

    // Reset map
    function resetMap() {
      map.setView([20, 78], 5);
      document.getElementById('facilityInfo').innerHTML = 'Select a location or use My Location to find nearby facilities.';
    }

    // Event handlers
    document.getElementById('btnLocate').addEventListener('click', getCurrentLocation);
    document.getElementById('btnKerala').addEventListener('click', focusKerala);
    document.getElementById('btnReset').addEventListener('click', resetMap);

    // Auto-focus Kerala on page load
    focusKerala();
  </script>
</body>
</html>
