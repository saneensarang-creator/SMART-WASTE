<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup - SMART WASTE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-signup-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }

        .admin-signup-box {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
        }

        .admin-signup-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .admin-signup-box .form-group {
            margin-bottom: 1.5rem;
        }

        .admin-signup-box label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .admin-signup-box input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .admin-signup-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .admin-signup-box button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .admin-signup-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .admin-signup-box button:active {
            transform: translateY(0);
        }

        .admin-signup-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.95rem;
        }

        .admin-signup-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .admin-signup-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-bottom: 1rem;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .admin-signup-box {
                padding: 2rem;
            }

            .admin-signup-box h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-signup-container">
        <div class="admin-signup-box">
            <div class="back-link">
                <a href="index.html">← Back to Home</a>
            </div>
            <h1>Admin Sign Up</h1>
            <form id="adminSignupPageForm">
                <div class="form-group">
                    <label for="adminSignupPageEmail">Email Address</label>
                    <input type="email" id="adminSignupPageEmail" placeholder="Enter your admin email" required>
                </div>
                <div class="form-group">
                    <label for="adminSignupPagePassword">Password</label>
                    <input type="password" id="adminSignupPagePassword" placeholder="Create a strong password" required>
                </div>
                <div class="form-group">
                    <label for="adminSignupPageConfirmPassword">Confirm Password</label>
                    <input type="password" id="adminSignupPageConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Admin Account</button>
            </form>
            <div class="admin-signup-footer">
                Already have an admin account? <a href="admin-login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="local-database.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminSignupPageForm = document.getElementById('adminSignupPageForm');
            if (adminSignupPageForm) {
                adminSignupPageForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('adminSignupPageEmail').value.trim();
                    const password = document.getElementById('adminSignupPagePassword').value;
                    const confirmPassword = document.getElementById('adminSignupPageConfirmPassword').value;
                    
                    if (password !== confirmPassword) {
                        alert('Passwords do not match');
                        return;
                    }

                    if (password.length < 6) {
                        alert('Password must be at least 6 characters long');
                        return;
                    }
                    
                    try {
                        const userData = userDB.register(email, password);
                        localStorage.setItem('user', JSON.stringify(userData));
                        sessionStorage.setItem('adminAuthenticated', 'true');
                        // Redirect to admin dashboard
                        window.location.href = 'admin.html';
                    } catch (error) {
                        alert('Sign up failed: ' + error.message);
                    }
                });
            }
        });
    </script>
</body>
</html>
